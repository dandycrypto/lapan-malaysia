# Lapan Malaysia test instance -> Node adapter on 127.0.0.1:8771
# TLS is added by Certbot once lapan-test.dysolvit.com resolves.

server {
    listen 80;
    server_name lapan-test.dysolvit.com;

    # ACME stays reachable from anywhere: Let's Encrypt validates from the US.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
