# Lapan Malaysia test instance -> Node adapter on 127.0.0.1:8771
# TLS via Let's Encrypt (certonly --webroot).
#
# DNS-only (grey cloud): Cloudflare's edge serves a different app for this exact
# hostname while proxied, so the A record for lapan-test.dysolvit.com is not
# proxied and nginx terminates TLS here. The /api/ rate limit stands in for the
# Cloudflare geo gate used by the other dysolvit sites.

server {
    listen 80;
    server_name lapan-test.dysolvit.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lapan-test.dysolvit.com;

    ssl_certificate /etc/letsencrypt/live/lapan-test.dysolvit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapan-test.dysolvit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lapan-test_access.log;
    error_log  /var/log/nginx/lapan-test_error.log;

    # Live routing spends the TomTom allowance, so cap request bursts per client.
    location /api/ {
        limit_req zone=lapan_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
